# Grafana dashboard provisioning: every JSON file under /var/lib/grafana/dashboards is loaded at start.
apiVersion: 1
providers:
  - name: pvdx
    orgId: 1
    folder: PVDX
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
