[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pvdx-ground"
version = "0.2.0"
description = "PVDX ground software: SatNOGS and ground-station telemetry ingest, decode, storage, HTTP API and Redis publishing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27,<1",
    "influxdb-client>=1.40,<2",
    "satnogs-decoders>=1.100",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "redis>=5,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pvdx-ingest = "pvdx_ground.ingest.__main__:main"
pvdx-decode = "pvdx_ground.decode.__main__:main"
pvdx-serve = "pvdx_ground.serve.__main__:main"
pvdx-push = "pvdx_ground.push.__main__:main"

[tool.setuptools.packages.find]
include = ["pvdx_ground*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
